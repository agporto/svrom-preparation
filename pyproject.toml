[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svrom-preparation"
version = "0.3.0"
description = "SSM-guided vertebral articulation and contact-patch preparation for SVROM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "svrom-python>=0.7.1,<1",
  "numpy>=1.26",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "trimesh>=4.0",
  "vtk>=9.3",
]

[project.optional-dependencies]
ssm = ["rustcpd>=3.1,<4"]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/agporto/svrom-preparation"

[project.scripts]
svrom-prepare = "svrom_preparation.cli:main"
svrom-articulate = "svrom_preparation.cli:main"
svrom-prepare-check = "svrom_preparation.validation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["svrom_preparation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
